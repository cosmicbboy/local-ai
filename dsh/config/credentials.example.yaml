# Copy this to ~/.dsh/.credentials.yaml (chmod 600) and fill in real secrets.
# The `refs` map is how dsh resolves provider keys that aren't in the env.
# NEVER commit this file with real secret values.
version: 1
records:
  client-connection/browser-session:
    kind: grant
    payload:
      version: 1
      secret: ""              # browser-trust secret — generated on first `dsh web` run
refs:
  QWEN_TOKEN_PLAN_API_KEY: "sk-..."   # QwenCloud token-plan API key
  DGX_SPARK_API_KEY: "EMPTY"          # local DGX Spark needs no real key
